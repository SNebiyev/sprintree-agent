name: test
on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["18.7.0", 22, 24] # the 18.7.0 entry is MIN_NODE of st.mjs (a test checks that the matrix lists it)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test # node --test: client, tool-consistency check, version check, JSON manifests
  # Installs the plugin with the real Claude Code, Codex and Gemini CLIs. No model login, no sprintree.com call: only the
  # install commands from the README run, against a copy of the checkout in a folder with a space in its path.
  install-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CI: "1"
      DISABLE_AUTOUPDATER: "1"
      DISABLE_TELEMETRY: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      GEMINI_CLI_NO_RELAUNCH: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false # the tree, .git included, is copied into the plugin dir the CLIs read
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Exact versions, each published more than two weeks before this job was written (claude-code 2.1.281 on 2026-09-23,
      # codex 0.156.1 on 2026-09-23, gemini-cli 0.61.0 on 2026-09-24). Bump them on purpose, never to "latest".
      - name: Install the CLIs
        shell: bash
        run: |
          set -euo pipefail
          # claude-code keeps its install script: its postinstall puts the native binary in place (without it `claude` stops with "native binary not installed")
          npm install -g --no-audit --no-fund @anthropic-ai/claude-code@2.1.281
          npm install -g --ignore-scripts --no-audit --no-fund @openai/codex@0.156.1 @google/gemini-cli@0.61.0
      - name: Copy the checkout to a path with a space
        shell: bash
        run: |
          set -euo pipefail
          cp -R "$GITHUB_WORKSPACE" "$RUNNER_TEMP/sprintree agent"
          mkdir -p "$HOME/.codex"
          claude --version
          codex --version
          gemini --version
      - name: Claude Code - validate, add the marketplace, install the plugin
        shell: bash
        run: |
          set -euo pipefail
          COPY="$RUNNER_TEMP/sprintree agent"
          claude plugin validate "$COPY"
          claude plugin marketplace add "$COPY"
          claude plugin install sprintree@sprintree
          claude plugin list | tee claude-list.txt
          grep -q 'sprintree@sprintree' claude-list.txt
          grep -A4 'sprintree@sprintree' claude-list.txt | grep -q 'Status: ✔ enabled'
      - name: Codex - add the marketplace, install the plugin
        shell: bash
        run: |
          set -euo pipefail
          COPY="$RUNNER_TEMP/sprintree agent"
          codex plugin marketplace add "$COPY"
          codex plugin add sprintree@sprintree
          codex plugin list | tee codex-list.txt
          grep -Eq 'sprintree@sprintree +installed, enabled' codex-list.txt
      - name: Gemini CLI - link the extension
        shell: bash
        run: |
          set -euo pipefail
          COPY="$RUNNER_TEMP/sprintree agent"
          gemini extensions link "$COPY" --consent
          # `gemini extensions list` prints to stderr, so 2>&1 puts it in the file; under pipefail a non-zero gemini exit code fails this step
          gemini extensions list 2>&1 | tee gemini-list.txt
          grep -q '✓ sprintree' gemini-list.txt
      - name: st.mjs config reads .sprintree.json (bash)
        shell: bash
        run: |
          set -euo pipefail
          PROJ="$RUNNER_TEMP/smoke project"
          mkdir -p "$PROJ/.git"
          printf '{"project":"SMOKE"}\n' > "$PROJ/.sprintree.json"
          cd "$PROJ"
          node "$RUNNER_TEMP/sprintree agent/skills/sprintree/scripts/st.mjs" config | tee config.txt
          grep -q '"project": "SMOKE"' config.txt
      - name: st.mjs config reads .sprintree.json (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proj = Join-Path $env:RUNNER_TEMP 'smoke project ps'
          New-Item -ItemType Directory -Force (Join-Path $proj '.git') | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $proj '.sprintree.json'), '{"project":"SMOKE"}', (New-Object System.Text.UTF8Encoding $false))
          Set-Location $proj
          $out = node (Join-Path $env:RUNNER_TEMP 'sprintree agent\skills\sprintree\scripts\st.mjs') config | Out-String
          Write-Output $out
          if ($out -notmatch '"project": "SMOKE"') { throw 'config does not name SMOKE' }
